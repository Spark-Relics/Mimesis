<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pelican Seaside Ride</title>
<style>
  :root {
    --sky-top: #8fd3e8;
    --sky-bottom: #ffe9b8;
    --sand: #e9cf8f;
    --sand-dark: #d8b868;
    --frame: #2a3b4d;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #0e1a24;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  }

  .stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }

  .scene {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  /* ---------- Sky ---------- */
  .sky {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg,
      var(--sky-top) 0%,
      #bfe3ef 42%,
      #fde9b6 78%,
      var(--sand) 100%);
  }

  .sun {
    position: absolute;
    top: 12%;
    right: 14%;
    width: 110px;
    height: 110px;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 40%, #fff3c9, #ffd86b 60%, #ffb74d 100%);
    box-shadow: 0 0 90px 30px rgba(255, 209, 102, 0.55);
    animation: sunPulse 5s ease-in-out infinite;
  }

  @keyframes sunPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }

  /* ---------- Scrolling layers ---------- */
  .layer {
    position: absolute;
    left: 0;
    width: 200%;
    will-change: transform;
  }
  .layer svg { display: block; width: 100%; height: 100%; }

  .clouds  { top: 4%;  height: 24%; animation: scroll 90s linear infinite; opacity: .92; }
  .far     { top: 28%; height: 20%; animation: scroll 60s linear infinite; }
  .sea     { top: 44%; height: 18%; animation: scroll 45s linear infinite; }
  .waves   { top: 58%; height: 10%; animation: scroll 22s linear infinite; }
  .beach   { top: 64%; height: 16%; animation: scroll 30s linear infinite; }
  .near    { top: 78%; height: 24%; animation: scroll 14s linear infinite; }

  @keyframes scroll {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }

  /* ---------- Bicycle + Pelican ---------- */
  .rider {
    position: absolute;
    left: 50%;
    bottom: 16%;
    width: clamp(180px, 26vh, 320px);
    transform: translateX(-50%);
    filter: drop-shadow(0 14px 12px rgba(20, 40, 60, .28));
    animation: bob 1.1s ease-in-out infinite;
  }

  @keyframes bob {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50%      { transform: translateX(-50%) translateY(-8px); }
  }

  .wheel {
    transform-box: fill-box;
    transform-origin: center;
    animation: spin 1s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .pedal {
    transform-box: fill-box;
    transform-origin: center;
    animation: spin 1s linear infinite;
  }

  .pelican-head {
    transform-box: fill-box;
    transform-origin: 60% 70%;
    animation: headBob 1.1s ease-in-out infinite;
  }

  @keyframes headBob {
    0%, 100% { transform: rotate(-3deg); }
    50%      { transform: rotate(3deg); }
  }

  .scarf {
    transform-box: fill-box;
    transform-origin: left center;
    animation: scarfWave 1s ease-in-out infinite;
  }

  @keyframes scarfWave {
    0%, 100% { transform: rotate(0deg) skewY(0deg); }
    50%      { transform: rotate(-6deg) skewY(4deg); }
  }

  /* ---------- Speed lines ---------- */
  .speed {
    position: absolute;
    top: 55%;
    left: 6%;
    width: 22%;
    height: 18%;
    pointer-events: none;
  }
  .speed span {
    position: absolute;
    display: block;
    height: 4px;
    border-radius: 4px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.85));
    animation: dash 0.7s linear infinite;
  }
  .speed span:nth-child(1) { top: 10%; width: 60%; animation-delay: 0s; }
  .speed span:nth-child(2) { top: 38%; width: 85%; animation-delay: .18s; }
  .speed span:nth-child(3) { top: 66%; width: 45%; animation-delay: .36s; }

  @keyframes dash {
    0%   { transform: translateX(-30%); opacity: 0; }
    30%  { opacity: 1; }
    100% { transform: translateX(130%); opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    /* biome-ignore lint/complexity/noImportantStyles: accessibility — must override every animation above */
    * { animation: none !important; }
  }
</style>
</head>
<body>
<div class="stage">

  <div class="sky"></div>
  <div class="sun"></div>

  <!-- Clouds -->
  <svg class="layer clouds" viewBox="0 0 2400 300" preserveAspectRatio="none" aria-hidden="true">
    <g fill="#ffffff" opacity=".95">
      <ellipse cx="220"  cy="120" rx="130" ry="46" />
      <ellipse cx="330"  cy="100" rx="90"  ry="36" />
      <ellipse cx="900"  cy="70"  rx="150" ry="50" />
      <ellipse cx="1060" cy="95"  rx="100" ry="38" />
      <ellipse cx="1650" cy="130" rx="170" ry="52" />
      <ellipse cx="1830" cy="105" rx="110" ry="40" />
    </g>
    <g fill="#ffffff" opacity=".55" transform="translate(1200 0)">
      <ellipse cx="220"  cy="180" rx="130" ry="42" />
      <ellipse cx="900"  cy="200" rx="150" ry="46" />
      <ellipse cx="1650" cy="175" rx="160" ry="48" />
    </g>
  </svg>

  <!-- Distant town / cliffs -->
  <svg class="layer far" viewBox="0 0 2400 260" preserveAspectRatio="none" aria-hidden="true">
    <g fill="#9ec8d8" opacity=".8">
      <path d="M0 260 L0 170 L120 120 L210 190 L330 90 L440 200 L560 150 L700 210 L820 130 L960 200 L1100 110 L1240 190 L1380 140 L1520 200 L1660 120 L1800 180 L1940 150 L2080 200 L2230 130 L2400 190 L2400 260 Z" />
    </g>
    <g fill="#f6f4f0" opacity=".85">
      <rect x="300" y="150" width="26" height="42" />
      <rect x="336" y="162" width="20" height="30" />
      <rect x="1180" y="130" width="28" height="46" />
      <rect x="1216" y="146" width="22" height="30" />
      <rect x="1900" y="160" width="26" height="42" />
    </g>
    <g fill="#8fb9c9" opacity=".55" transform="translate(1200 0)">
      <path d="M0 260 L0 190 L140 140 L280 200 L420 150 L560 210 L700 160 L840 200 L980 150 L1120 200 L1260 140 L1400 190 L1540 160 L1680 200 L1820 150 L1960 190 L2100 160 L2240 200 L2400 170 L2400 260 Z" />
    </g>
  </svg>

  <!-- Sea -->
  <svg class="layer sea" viewBox="0 0 2400 200" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <linearGradient id="seaGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"  stop-color="#7cc3d8" />
        <stop offset="100%" stop-color="#3f93b4" />
      </linearGradient>
    </defs>
    <rect width="2400" height="200" fill="url(#seaGrad)" />
    <g stroke="#ffffff" stroke-width="4" fill="none" opacity=".35">
      <path d="M0 40 q60 -18 120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0" />
      <path d="M0 110 q70 -20 140 0 t140 0 t140 0 t140 0 t140 0 t140 0 t140 0 t140 0 t140 0 t140 0 t140 0 t140 0 t140 0 t140 0 t140 0" />
    </g>
    <g fill="#ffffff" opacity=".5">
      <path d="M0 200 L0 160 q80 -14 160 0 t160 0 t160 0 t160 0 t160 0 t160 0 t160 0 t160 0 t160 0 t160 0 t160 0 t160 0 t160 0 t160 0 L2400 200 Z" />
    </g>
  </svg>

  <!-- Foam waves -->
  <svg class="layer waves" viewBox="0 0 2400 120" preserveAspectRatio="none" aria-hidden="true">
    <g fill="#eaf9ff" opacity=".9">
      <path d="M0 60 q50 -26 100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 L2400 120 L0 120 Z" />
    </g>
    <g fill="#ffffff" opacity=".8">
      <path d="M0 90 q70 -18 140 0 t140 0 t140 0 t140 0 t140 0 t140 0 t140 0 t140 0 t140 0 t140 0 t140 0 t140 0 t140 0 t140 0 t140 0 t140 0 t140 0 t140 0 L2400 120 L0 120 Z" />
    </g>
  </svg>

  <!-- Sandy beach strip -->
  <svg class="layer beach" viewBox="0 0 2400 160" preserveAspectRatio="none" aria-hidden="true">
    <rect width="2400" height="160" fill="#ecd69a" />
    <g fill="#e0c483">
      <ellipse cx="200"  cy="120" rx="90" ry="12" />
      <ellipse cx="760"  cy="140" rx="120" ry="14" />
      <ellipse cx="1500" cy="125" rx="100" ry="12" />
      <ellipse cx="2050" cy="145" rx="130" ry="14" />
    </g>
    <g fill="#2f6b52">
      <path d="M420 150 q10 -40 22 -8 q6 -30 12 -6 q8 -34 16 -4 l-8 18 z" />
      <path d="M1780 148 q12 -46 24 -8 q6 -32 13 -6 q9 -38 18 -4 l-9 18 z" />
    </g>
    <g fill="#d9b77a" transform="translate(1200 0)">
      <ellipse cx="300" cy="125" rx="100" ry="13" />
      <ellipse cx="1100" cy="142" rx="125" ry="15" />
    </g>
  </svg>

  <!-- Near foreground: grass + shells -->
  <svg class="layer near" viewBox="0 0 2400 140" preserveAspectRatio="none" aria-hidden="true">
    <g fill="#d8b868">
      <rect width="2400" height="140" />
    </g>
    <g stroke="#8f7a3f" stroke-width="5" stroke-linecap="round">
      <path d="M60 140 q6 -50 -6 -90 M84 140 q-4 -52 8 -92 M108 140 q8 -48 -2 -86" fill="none" />
      <path d="M1560 140 q6 -52 -6 -94 M1586 140 q-4 -54 8 -96 M1612 140 q8 -50 -2 -90" fill="none" />
    </g>
    <g fill="#f3e2bd">
      <path d="M900 130 q18 -34 40 -8 q-16 22 -40 8 z" />
      <path d="M2180 128 q18 -32 40 -8 q-16 22 -40 8 z" />
    </g>
    <g transform="translate(1200 0)">
      <g stroke="#8f7a3f" stroke-width="5" stroke-linecap="round" fill="none">
        <path d="M700 140 q6 -50 -6 -90 M724 140 q-4 -52 8 -92" />
      </g>
      <g fill="#f3e2bd">
        <path d="M1400 130 q18 -34 40 -8 q-16 22 -40 8 z" />
      </g>
    </g>
  </svg>

  <!-- Speed lines -->
  <div class="speed" aria-hidden="true">
    <span></span><span></span><span></span>
  </div>

  <!-- Bicycle + Pelican -->
  <svg class="rider" viewBox="0 0 400 340" role="img" aria-label="A pelican riding a bicycle along the seaside">
    <defs>
      <linearGradient id="frameGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"  stop-color="#3c5a73" />
        <stop offset="100%" stop-color="#22384a" />
      </linearGradient>
      <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"  stop-color="#ffffff" />
        <stop offset="100%" stop-color="#dfe8ee" />
      </linearGradient>
      <radialGradient id="cheek" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#ffd1dc" />
        <stop offset="100%" stop-color="#ffb3c6" />
      </radialGradient>
    </defs>

    <!-- Ground shadow -->
    <ellipse cx="200" cy="322" rx="150" ry="14" fill="#1b2c3a" opacity=".22" />

    <!-- Rear wheel -->
    <g transform="translate(108 248)">
      <circle cx="0" cy="0" r="62" fill="none" stroke="#1c2c3a" stroke-width="9" />
      <g class="wheel">
        <circle cx="0" cy="0" r="52" fill="none" stroke="#5d7f96" stroke-width="4" />
        <g stroke="#7fa3ba" stroke-width="3">
          <line x1="0" y1="-52" x2="0" y2="52" />
          <line x1="-52" y1="0" x2="52" y2="0" />
          <line x1="-37" y1="-37" x2="37" y2="37" />
          <line x1="37" y1="-37" x2="-37" y2="37" />
        </g>
        <circle cx="0" cy="0" r="8" fill="#1c2c3a" />
      </g>
    </g>

    <!-- Front wheel -->
    <g transform="translate(292 248)">
      <circle cx="0" cy="0" r="62" fill="none" stroke="#1c2c3a" stroke-width="9" />
      <g class="wheel">
        <circle cx="0" cy="0" r="52" fill="none" stroke="#5d7f96" stroke-width="4" />
        <g stroke="#7fa3ba" stroke-width="3">
          <line x1="0" y1="-52" x2="0" y2="52" />
          <line x1="-52" y1="0" x2="52" y2="0" />
          <line x1="-37" y1="-37" x2="37" y2="37" />
          <line x1="37" y1="-37" x2="-37" y2="37" />
        </g>
        <circle cx="0" cy="0" r="8" fill="#1c2c3a" />
      </g>
    </g>

    <!-- Bicycle frame -->
    <g stroke="url(#frameGrad)" stroke-width="11" stroke-linecap="round" fill="none">
      <path d="M108 248 L196 150 L292 248" />
      <path d="M196 150 L236 96 L292 248" />
      <path d="M196 150 L168 96 L236 96" />
      <path d="M236 96 L250 60" />
    </g>

    <!-- Seat + handlebar -->
    <path d="M150 88 q26 -12 52 0 q-10 12 -26 12 q-16 0 -26 -12 z" fill="#e8b45c" />
    <path d="M236 96 q-22 -6 -34 6 M236 96 q22 -6 34 6" stroke="#e8b45c" stroke-width="10" fill="none" stroke-linecap="round" />
    <path d="M250 60 q14 -8 22 4" stroke="#1c2c3a" stroke-width="8" fill="none" stroke-linecap="round" />

    <!-- Pedals (rotating crank) -->
    <g transform="translate(196 232)">
      <g class="pedal">
        <line x1="0" y1="0" x2="0" y2="26" stroke="#1c2c3a" stroke-width="6" />
        <rect x="-14" y="24" width="28" height="10" rx="4" fill="#e8b45c" />
        <line x1="0" y1="0" x2="0" y2="-26" stroke="#1c2c3a" stroke-width="6" />
        <rect x="-14" y="-34" width="28" height="10" rx="4" fill="#e8b45c" />
        <circle cx="0" cy="0" r="7" fill="#3c5a73" />
      </g>
    </g>

    <!-- Pelican body (seated) -->
    <g>
      <!-- tail -->
      <path d="M120 118 q-34 -6 -44 18 q22 -2 44 10 z" fill="#e8eef3" />

      <!-- torso -->
      <path d="M120 112
               q60 -34 120 -18
               q34 8 40 30
               q-8 26 -52 34
               q-66 12 -108 -10
               q-14 -18 0 -36 z"
            fill="url(#bodyGrad)" />
      <!-- wing -->
      <path d="M150 116 q52 -6 92 8 q-12 26 -60 30 q-34 2 -42 -14 z"
            fill="#c9d8e2" />

      <!-- legs to pedals -->
      <path d="M170 156 q10 40 26 72" stroke="#e8b45c" stroke-width="9" fill="none" stroke-linecap="round" />
      <path d="M212 152 q14 42 30 70" stroke="#e8b45c" stroke-width="9" fill="none" stroke-linecap="round" />

      <!-- scarf -->
      <path class="scarf" d="M238 96 q26 8 34 30 q-24 -4 -38 -22 z" fill="#e0556b" />

      <!-- neck + head -->
      <g class="pelican-head">
        <path d="M236 96 q22 -30 52 -26 q22 4 26 24 q-18 10 -40 8 q-26 -2 -38 -6 z" fill="#ffffff" />
        <!-- beak with pouch -->
        <path d="M312 94 q34 -4 46 10 q-30 12 -50 8 q-8 -10 4 -18 z" fill="#f0b64c" />
        <path d="M312 112 q30 10 46 8 q-14 12 -40 10 q-12 -8 -6 -18 z" fill="#e0a23c" />
        <!-- eye -->
        <circle cx="296" cy="88" r="7" fill="#22303c" />
        <circle cx="298" cy="86" r="2.4" fill="#ffffff" />
        <!-- crest -->
        <path d="M248 66 q14 -16 30 -8 q-8 12 -30 8 z" fill="#f0b64c" />
      </g>
    </g>
  </svg>

</div>
</body>
</html>
